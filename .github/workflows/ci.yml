name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ios:
    runs-on: macos-26
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build and test Midscene runtime
        run: |
          corepack enable
          corepack prepare pnpm@10.11.0 --activate
          pnpm --dir Midscene install --frozen-lockfile
          pnpm --dir Midscene test
          pnpm --dir Midscene build
      - name: Unit tests (simulator, unsigned)
        run: |
          # The app imports the iOS 27 ScreenCaptureKit API; fail clearly on older runner images.
          sdk=$(xcrun --sdk iphoneos --show-sdk-version)
          if [ "${sdk%%.*}" -lt 27 ]; then
            echo "Xcode 27+ and an iOS 27+ simulator runtime are required (found SDK $sdk)."
            exit 1
          fi
          sim=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(v["udid"] for k,vs in d["devices"].items() if "iOS-27" in k for v in vs if v["name"].startswith("iPhone")))')
          xcodebuild test -scheme IPhoneAgent -destination "platform=iOS Simulator,id=$sim" \
            -testLanguage en -testRegion US -derivedDataPath build-sim CODE_SIGNING_ALLOWED=NO


  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: arduino/setup-arduino-cli@v2
      - run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "NimBLE-Arduino@2.5.1"
      - name: Build
        run: hardware/flash.sh --build-only
      - name: Host tests (HID reports and input lifecycle)
        run: make -C hardware/tests
